name: docgrading

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docgrading}
      POSTGRES_USER: ${POSTGRES_USER:-docgrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  storage:
    image: localstack/localstack:4.11.1
    environment:
      SERVICES: s3
      EAGER_SERVICE_LOADING: "1"
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  storage-init:
    image: localstack/localstack:4.11.1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        (awslocal --endpoint-url http://storage:4566 s3api head-bucket
        --bucket "$${STORAGE_BUCKET}" ||
        awslocal --endpoint-url http://storage:4566 s3api create-bucket
        --bucket "$${STORAGE_BUCKET}") &&
        awslocal --endpoint-url http://storage:4566 s3api put-bucket-cors
        --bucket "$${STORAGE_BUCKET}"
        --cors-configuration "{\"CORSRules\":[{\"AllowedHeaders\":[\"*\"],\"AllowedMethods\":[\"GET\",\"HEAD\",\"POST\"],\"AllowedOrigins\":[\"$${FRONTEND_ORIGIN}\",\"http://127.0.0.1:5173\"],\"ExposeHeaders\":[\"Accept-Ranges\",\"Content-Length\",\"Content-Range\",\"ETag\"],\"MaxAgeSeconds\":300}]}" &&
        awslocal --endpoint-url http://storage:4566 s3api put-bucket-lifecycle-configuration
        --bucket "$${STORAGE_BUCKET}"
        --lifecycle-configuration "{\"Rules\":[{\"ID\":\"expire-staging-uploads\",\"Filter\":{\"Prefix\":\"uploads/\"},\"Status\":\"Enabled\",\"Expiration\":{\"Days\":1}}]}"
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-docgrading}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-test}
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JOIN_RATE_LIMIT_HASH_SECRET: ${JOIN_RATE_LIMIT_HASH_SECRET:-change-me-for-local-development-only}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.255.3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-docgrading}
      STORAGE_ENDPOINT_URL: http://storage:4566
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-test}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-test}
      STORAGE_PRESIGN_EXPIRY_SECONDS: ${STORAGE_PRESIGN_EXPIRY_SECONDS:-300}
      # Development only: Settings rejects a recovery dir outside APP_ENV=development
      # because a local copy re-uploads PDFs deleted from the bucket. Set it empty there.
      STORAGE_RECOVERY_DIR: ${STORAGE_RECOVERY_DIR-/var/lib/docgrading/storage}
      PDF_MAX_SIZE_BYTES: ${PDF_MAX_SIZE_BYTES:-100000000}
      PDF_MAX_DECODED_BYTES: ${PDF_MAX_DECODED_BYTES:-50000000}
      PDF_MAX_PAGE_COUNT: ${PDF_MAX_PAGE_COUNT:-100}
      ANALYSIS_JOB_LEASE_SECONDS: ${ANALYSIS_JOB_LEASE_SECONDS:-300}
      ANALYSIS_JOB_HEARTBEAT_SECONDS: ${ANALYSIS_JOB_HEARTBEAT_SECONDS:-30}
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - storage_recovery:/var/lib/docgrading/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - backend
      - proxy

  worker:
    build:
      context: backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_BUCKET: ${STORAGE_BUCKET:-docgrading}
      STORAGE_ENDPOINT_URL: http://storage:4566
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-test}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-test}
      STORAGE_PRESIGN_EXPIRY_SECONDS: ${STORAGE_PRESIGN_EXPIRY_SECONDS:-300}
      STORAGE_RECOVERY_DIR: ${STORAGE_RECOVERY_DIR-/var/lib/docgrading/storage}
      PDF_MAX_SIZE_BYTES: ${PDF_MAX_SIZE_BYTES:-100000000}
      PDF_MAX_DECODED_BYTES: ${PDF_MAX_DECODED_BYTES:-50000000}
      PDF_MAX_PAGE_COUNT: ${PDF_MAX_PAGE_COUNT:-100}
      ANALYSIS_JOB_LEASE_SECONDS: ${ANALYSIS_JOB_LEASE_SECONDS:-300}
      ANALYSIS_JOB_HEARTBEAT_SECONDS: ${ANALYSIS_JOB_HEARTBEAT_SECONDS:-30}
    command: >-
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=INFO --concurrency=2 --prefetch-multiplier=1
      --max-tasks-per-child=10
    volumes:
      - storage_recovery:/var/lib/docgrading/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      # Only with the `encoder` profile: wait until both models are loaded, so the
      # first jobs after a deploy do not fall back to keyword retrieval.
      encoder:
        condition: service_healthy
        required: false
      reranker:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5",
        ]
      interval: 10s
      timeout: 8s
      start_period: 15s
      retries: 5
    networks: [backend]

  # Self-hosted text encoder for semantic retrieval (`encoder` profile). Deployments
  # enable it with COMPOSE_PROFILES=encoder in .env plus SEMANTIC_ENCODER_URL=
  # http://encoder/v1, SEMANTIC_ENCODER_MODEL=BAAI/bge-m3 and SEMANTIC_RERANKER_URL=
  # http://reranker (see .env.example). On CPU each TEI process holds about 5.5 GB
  # after warmup, so the pair needs a host with at least 16 GB RAM (an 8 GB Docker VM
  # OOM-kills them); the first start downloads about 4.5 GB into `encoder_models`.
  # On a T4 GPU use the `turing-1.9` image with USE_FLASH_ATTENTION=False (or
  # --dtype float32): its default fp16 flash path returns NaN vectors/scores.
  encoder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [encoder]
    # --max-batch-tokens 2048 (default 16384) keeps warmup within memory: bge-m3
    # warms up with full-length batches and was OOM-killed at 16384 and 8192.
    # With --auto-truncate, longer inputs are truncated to 2048 tokens rather than
    # rejected. All 26,565 v1 benchmark passages are under 3,400 characters, but
    # production allows passages up to 4,000 characters, so number-heavy ones may
    # be cut; benchmark on this runtime before approving a gate entry.
    command:
      [
        "--model-id", "BAAI/bge-m3",
        "--revision", "5617a9f61b028005a4858fdac845db406aefb181",
        "--auto-truncate",
        "--max-batch-tokens", "2048",
      ]
    volumes:
      - encoder_models:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      start_period: 20m
      retries: 4
    networks: [backend]

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [encoder]
    command:
      [
        "--model-id", "BAAI/bge-reranker-v2-m3",
        "--revision", "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e",
        "--auto-truncate",
        "--max-batch-tokens", "2048",
      ]
    depends_on:
      encoder:
        condition: service_healthy
    volumes:
      - encoder_models:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      start_period: 20m
      retries: 4
    networks: [backend]

  frontend:
    build:
      context: frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.30.255.3

  load-smoke:
    image: ghcr.io/astral-sh/uv:0.11.19-python3.13-trixie-slim
    profiles: [smoke]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-docgrading}
      POSTGRES_USER: ${POSTGRES_USER:-docgrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT_URL: http://storage:4566
      UV_PROJECT_ENVIRONMENT: /tmp/t022-venv
    working_dir: /app
    volumes:
      - ./backend:/app:ro
      - ./artifacts:/results
    command:
      [
        "uv",
        "run",
        "--frozen",
        "python",
        "scripts/load_smoke.py",
        "--base-url",
        "http://api:8000",
        "--storage-base-url",
        "http://storage:4566",
        "--users",
        "${LOAD_USERS:-8}",
        "--duration",
        "${LOAD_DURATION_SECONDS:-30}",
        "--output",
        "/results/t022-load-results.json",
      ]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [backend]

  backup:
    image: postgres:17-bookworm
    profiles: [ops]
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-docgrading}
      POSTGRES_USER: ${POSTGRES_USER:-docgrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - ./backups:/backups
      - ./backend/scripts:/scripts:ro
    command: ["sh", "/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  restore-postgres:
    image: postgres:17-bookworm
    profiles: [ops]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-docgrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks: [restore]

  restore-smoke:
    image: postgres:17-bookworm
    profiles: [ops]
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: restore-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-docgrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
      RESTORE_DB: docgrading_restore
    volumes:
      - ./backups:/backups:ro
      - ./backend/scripts:/scripts:ro
    command: ["sh", "/scripts/restore_smoke.sh"]
    depends_on:
      restore-postgres:
        condition: service_healthy
    networks: [restore]

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  storage_recovery:
  encoder_models:

networks:
  backend:
    driver: bridge
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.255.0/29
  restore:
    driver: bridge
    internal: true
